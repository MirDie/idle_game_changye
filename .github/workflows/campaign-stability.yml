name: Campaign Stability

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

concurrency:
  group: campaign-stability-main
  cancel-in-progress: true

jobs:
  campaign-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and record
        shell: bash
        run: |
          set +e
          : > campaign-test.log
          code=0
          for file in full-content.js game-1.js content-bridge.js game-2.js game-3.js full-systems.js advanced-gameplay.js hotfixes.js campaign-stability.js; do
            node --check "$file" >> campaign-test.log 2>&1 || code=1
          done
          if [ "$code" -eq 0 ]; then
            node tests/campaign-e2e.test.js >> campaign-test.log 2>&1
            code=$?
          fi

          if [ "$code" -eq 0 ]; then result=success; else result=failure; fi
          {
            printf '# Campaign Stability Verification\n\n'
            printf -- '- Result: **%s**\n' "$result"
            printf -- '- Verified commit: `%s`\n' "${GITHUB_SHA}"
            printf -- '- Checks: syntax, 8-zone/80-floor final boss simulation, exact mid-floor save/load, offline single settlement, required-boss retry safety.\n\n'
            printf '## Test output\n\n```text\n'
            tail -n 160 campaign-test.log
            printf '\n```\n'
          } > CAMPAIGN_VERIFICATION.md

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add CAMPAIGN_VERIFICATION.md
            if ! git diff --cached --quiet; then
              git commit -m 'ci: record campaign stability result [skip ci]'
              git push origin HEAD:main
            fi
          fi
          exit "$code"
