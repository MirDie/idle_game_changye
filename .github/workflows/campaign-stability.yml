name: Campaign Stability

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

concurrency:
  group: campaign-stability-main
  cancel-in-progress: true

jobs:
  campaign-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check full-content.js
          node --check game-1.js
          node --check content-bridge.js
          node --check game-2.js
          node --check game-3.js
          node --check full-systems.js
          node --check advanced-gameplay.js
          node --check hotfixes.js
          node --check campaign-stability.js
      - name: Simulate complete campaign
        run: node tests/campaign-e2e.test.js

  record-result:
    if: always() && github.event_name == 'push'
    needs: campaign-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record result
        env:
          RESULT: ${{ needs.campaign-e2e.result }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          printf '# Campaign Stability Verification\n\n- Result: **%s**\n- Verified commit: `%s`\n- Checks: syntax, 8-zone/80-floor final boss simulation, exact mid-floor save/load, offline single settlement, required-boss retry safety.\n' "$RESULT" "$VERIFIED_SHA" > CAMPAIGN_VERIFICATION.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CAMPAIGN_VERIFICATION.md
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record campaign stability result [skip ci]'
            git push origin HEAD:main
          fi
